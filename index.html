<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Financeiro do Emanuel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
:root{--bg:#0b0e13;--panel:#10141b;--card:#12171f;--card2:#181e29;--line:#232b39;--tx:#eef1f6;--mut:#8791a5;--ac:#2dd4a7;--ac2:#25b88f;--acd:#0e2f28;--red:#f0606b;--grn:#2dd4a7;--org:#f59e0b;--navy:#dfe6f3;--navy2:#aab4c8;--pur:#8b7cf6;--field:#0e1218;--hover:#ffffff0b;--chip:#1b222d;--r:14px;--sh:0 1px 2px #0006}
[data-theme=light]{--bg:#f4f6fa;--panel:#ffffff;--card:#ffffff;--card2:#f6f8fc;--line:#e4e8f0;--tx:#0f1b36;--mut:#6b7794;--ac:#0fb48a;--ac2:#0c9a75;--acd:#e1f6ef;--red:#e5484d;--grn:#0e9f7e;--org:#d97706;--navy:#0f1b36;--navy2:#44527a;--pur:#6d5ce8;--field:#ffffff;--hover:#0f1b360a;--chip:#eef2fa;--sh:0 1px 2px #0f1b360d}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 13px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;transition:background .12s,border-color .12s}
button:hover{background:var(--hover);border-color:#ffffff22}
button.pri{background:var(--ac);border-color:var(--ac);color:#03251d}
button.pri:hover{background:var(--ac2);border-color:var(--ac2)}
button.dan{color:var(--red)}
button.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--field);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
.hide{display:none!important}
.ic{width:17px;height:17px;flex:none}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:380px}
.lbox h1{margin:0 0 4px;font-size:22px}.lbox p{margin:0 0 16px;color:var(--mut)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
/* app */
.app{display:grid;grid-template-columns:232px 1fr;gap:0;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font-weight:800;font-size:17px;padding:4px 10px 18px;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:#03251d}
.brand i .ic{width:18px;height:18px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--mut);margin-bottom:2px;font-weight:600;font-size:14px}
nav a:hover{background:var(--hover);color:var(--tx)}
nav a.on{background:var(--acd);color:var(--ac)}
.sp{flex:1}
main{min-width:0;padding:22px 32px 60px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}.top small{color:var(--mut);display:block;font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mes{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mes button{border:0;background:none;padding:7px 11px}.mes b{min-width:140px;text-align:center;display:block;font-size:14px;font-weight:600}.mes b::first-letter,.cap::first-letter{text-transform:uppercase}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{color:var(--mut);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}.kpi small .ic{width:15px;height:15px}
.kpi .v{font-size:26px;font-weight:700;margin:6px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--mut)}
.pos{color:var(--grn)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px}tr:last-child td{border-bottom:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--navy2);white-space:nowrap;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.ico.chip{background:var(--chip);color:var(--navy2)}
.item .nm{flex:1;min-width:0}.item .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}.item .nm small{color:var(--mut);font-size:12.5px}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:11.5px;color:var(--mut)}
.stk{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--chip)}
.col.cur .stk{outline:1.5px solid var(--navy2)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.empty{color:var(--mut);text-align:center;padding:24px 0;font-size:14px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:30}.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:470px;max-height:94vh;overflow:auto}.box h2{margin:0 0 4px;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;justify-content:center}.seg button.on{background:var(--ac);color:#03251d;border-color:var(--ac)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:11px 18px;border-radius:12px;display:none;z-index:40;max-width:90vw;text-align:center;box-shadow:0 8px 30px #0008;font-size:14px}
.fab{display:none}
.hint{color:var(--mut);font-size:12.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools>*{flex:1;min-width:120px}
.demo{background:#3a2f0b;color:#f3d77a;text-align:center;padding:6px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
@media(max-width:980px){.k4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{display:block}
  main{padding:14px 12px 100px}
  aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;border-right:0;border-top:1px solid var(--line);flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .brand,.sp,aside .out{display:none}
  nav{display:flex;width:100%;justify-content:space-around;overflow-x:auto}
  nav a{flex:none;flex-direction:column;gap:2px;font-size:11px;padding:6px 9px;margin:0}
  .top h1{font-size:21px}
  .mes{width:100%;justify-content:space-between}
  .fab{display:flex;position:fixed;right:14px;bottom:84px;z-index:25;background:var(--ac);color:#03251d;border:0;border-radius:99px;padding:13px 18px;font-weight:700;box-shadow:0 8px 24px #0008;gap:8px;align-items:center}
  th:nth-child(3),td:nth-child(3){display:none}
  .toast{bottom:150px}
  input,select{font-size:16px}button{min-height:40px}
  .box{padding:16px}.two{grid-template-columns:1fr}
}
@media(max-width:520px){.kpi .v{font-size:19px}.card{padding:14px}.kpi small{font-size:12px}.top .row>button[onclick*="arq"]{display:none}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ct .art{height:158px;border-radius:12px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background-size:cover;position:relative;overflow:hidden}
.ct .art:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff14}
.ct .arttop{display:flex;justify-content:space-between;align-items:center;font-size:15px;position:relative;z-index:1}
.ct .artfin{font-size:19px;letter-spacing:.14em;font-weight:600;position:relative;z-index:1;text-shadow:0 1px 6px #0006}
.mnu{display:none}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:50}#sheet.on{display:flex}
.shbox{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-height:80vh;overflow:auto}
.shgrip{width:38px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.shgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shgrid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--tx);cursor:pointer}
.shgrid a.on{background:var(--acd);color:var(--ac);border-color:transparent}
.shgrid .ic{width:22px;height:22px}
@media(max-width:860px){.mnu{display:flex}nav a:nth-child(n+5):not(.mnu){display:none}}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut svg{flex:none}
.leg2{flex:1;min-width:200px;display:grid;gap:8px;font-size:13px}.leg2>div{display:flex;align-items:center;gap:8px}.leg2 i{width:9px;height:9px;border-radius:3px;flex:none}.leg2 span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leg2 b{font-weight:600;font-variant-numeric:tabular-nums}.leg2 em{color:var(--mut);font-style:normal;width:34px;text-align:right}
</style>
</head>
<body>
<div id="demoBar" class="demo hide">Modo demonstração: dados de exemplo, nada é gravado.</div>

<div id="login" class="hide">
  <form class="lbox" id="lform">
    <h1>Financeiro</h1><p>Entre com o seu e-mail e senha.</p>
    <label>E-mail</label><input id="lemail" type="email" autocomplete="username" required>
    <label>Senha</label><input id="lsenha" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="pri" style="width:100%;margin-top:6px" type="submit">Entrar</button>
  </form>
</div>

<div class="app hide" id="app">
  <aside>
    <div class="brand"><i data-i="wallet"></i> Financeiro</div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <nav class="out"><a onclick="sair()"><span data-i="logout"></span><span>Sair</span></a></nav>
  </aside>
  <main>
    <div class="top">
      <div><h1 id="tit">Início</h1><small id="sub"></small></div>
      <div class="row">
        <div class="mes"><button onclick="mudaMes(-1)">‹</button><b id="mesTxt"></b><button onclick="mudaMes(1)">›</button></div>
        <button onclick="$('arq').click()"><span data-i="clip"></span> Comprovante</button>
        <button class="pri" onclick="abrirLanc()"><span data-i="plus"></span> Lançamento</button><button class="sm" id="btnTema" onclick="trocaTema()" title="Tema claro ou escuro"></button>
        <button class="sm" onclick="sair()" id="btnSair">Sair</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<button class="fab hide" id="fab" onclick="$('arq').click()"><span data-i="clip"></span> Comprovante</button>
<input type="file" id="arq" accept="image/*,.pdf" multiple class="hide" onchange="processaArquivos(this.files);this.value=''">
<div id="sheet"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>

<script>
try{document.documentElement.dataset.theme=localStorage.getItem('tema')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
const P={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',receipt:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',clip:'<path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',plus:'<path d="M12 5v14M5 12h14"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="M12 12L19 5"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'};
const I=n=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[n]||'')+'</svg>';
function pintaIcones(){document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=I(e.dataset.i));const b=document.getElementById('btnTema');if(b)b.innerHTML=I(document.documentElement.dataset.theme==='light'?'moon':'sun')}
function trocaTema(){const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('tema',n)}catch(e){}pintaIcones()}
const SB_URL='https://nlwyjcxunyxzmcqwtymn.supabase.co',SB_KEY='sb_publishable_vUhozeC7cgFzc9ORL4Z4Qw_YXM6QfI_';
const DEMO=location.hash==='#demo';
const sb=DEMO?null:supabase.createClient(SB_URL,SB_KEY);
const CAT_S=['Supermercado','Alimentação','Combustível','Moradia','Contas fixas','Saúde','Transporte','Lazer','Educação','Assinaturas','Compras','Impostos','Condomínio','Consórcio','Pensão alimentícia','Seguro','Gás','Internet e telefone','Família','Outros'];
const CAT_E=['Salário','Vendas / TB','Rendimentos','Outros'];
const CORES=['#1fd6a8','#f97316','#7c5cff','#38bdf8','#e5484d','#eab308','#14b8a6','#ec4899'];
const PALAVRAS={Supermercado:['mercado','supermerc','atacad','assai','carrefour','hortifruti','sacolao'],Alimentação:['restaurante','lanche','ifood','pizza','padaria','burger','cafe','acai'],Combustível:['posto','shell','ipiranga','gasolina','etanol'],Transporte:['uber','99','pedagio','estacion'],Saúde:['farmacia','drogaria','clinica','consulta'],Assinaturas:['netflix','spotify','youtube','prime','disney'],Moradia:['aluguel','condominio','iptu','energia','agua','internet']};
let S={uid:null,email:'',cartoes:[],fixas:[],lanc:[],contas:[],importacoes:[],saldoInicial:0};
let view='inicio',ym='',pend=null,tipoSel='saida';
const $=id=>document.getElementById(id);
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mesAtual(){return hojeStr().slice(0,7)}
function addMes(m,n){let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+pad(mo)}
function diasNoMes(m){const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function addMesData(d,n){const m=addMes(d.slice(0,7),n);return m+'-'+pad(Math.min(+d.slice(8,10),diasNoMes(m)))}
const nomeMes=m=>new Date(m+'-15T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const mesCurto=m=>new Date(m+'-15T12:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase();
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}

// ---------- dados ----------
const cartao=id=>S.cartoes.find(c=>c.id===id);
const corCartao=id=>{const i=S.cartoes.findIndex(c=>c.id===id);return CORES[(i<0?0:i)%CORES.length]};
async function carregar(){
  if(DEMO){demo();return}
  const [c,f,l,g,ct,im,fo,rg]=await Promise.all([
    sb.from('cartoes').select('*').order('criado_em'),
    sb.from('fixas').select('*').order('dia'),
    todos(()=>sb.from('lancamentos').select('*').order('data',{ascending:false}).order('id')),
    sb.from('config').select('*').maybeSingle(),
    sb.from('contas').select('*').order('criado_em'),
    sb.from('importacoes').select('*').order('criado_em',{ascending:false}).limit(30),sb.from('faturas_oficiais').select('*'),sb.from('regras').select('*')]);
  const e=c.error||f.error||l.error||g.error||ct.error||im.error;if(e){toast('Erro ao carregar: '+e.message);return}

// ---------- comprovante + IA ----------
async function prepara(file){
  if(file.type==='application/pdf')return{blob:file,mime:file.type,name:file.name};
  const bmp=await createImageBitmap(file),esc_=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*esc_);cv.height=Math.round(bmp.height*esc_);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));return{blob,mime:'image/jpeg',name:file.name.replace(/\.\w+$/,'')+'.jpg'}}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
async function processaArquivo(file){
  if(!file)return;
  if(/\.(ofx|csv|txt|xlsx?)$/i.test(file.name)){toast('Isso é um extrato: use a aba Importar');ir('import');return}
  if(DEMO){toast('Modo demonstração: a IA fica ligada só com login');return}
  toast('Lendo o documento…');
  try{pend=await prepara(file);
    let d;try{d=await lerIA(pend)}catch(e){toast('IA: '+e.message+' — preencha na mão');abrirLanc(null,{});return}
    const ehData=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');
    if(d.documento==='boleto'){
      abrirLanc(null,{tipo:'saida',status:'pendente',descricao:d.beneficiario||d.estabelecimento||d.descricao||'Boleto',beneficiario:d.beneficiario||d.estabelecimento||'',valor:d.valor||'',vencimento:ehData(d.vencimento)?d.vencimento:'',data:ehData(d.vencimento)?d.vencimento:hojeStr(),categoria:CAT_S.includes(d.categoria)?d.categoria:'Outros',finalidade:d.finalidade||''});
      toast('Boleto lido: confira e salve como "A pagar"');return}
    const m=acharPendente(d);
    if(m&&confirm('Parece o pagamento de "'+(m.beneficiario||m.descricao)+'" (vencia em '+(m.vencimento||m.data).split('-').reverse().join('/')+', '+BRL(m.valor)+').\nMarcar como PAGO e guardar este comprovante?')){
      await pagaPendente(m,pend,d);pend=null;return}
    const cart=S.cartoes[0],tipo=d.tipo==='entrada'?'entrada':(d.forma==='cartao'&&cart?'cartao':'saida');
    abrirLanc(null,{tipo,descricao:d.estabelecimento||d.descricao||'',beneficiario:d.beneficiario||d.estabelecimento||'',valor:d.valor||'',data:ehData(d.data)?d.data:hojeStr(),categoria:(tipo==='entrada'?CAT_E:CAT_S).includes(d.categoria)?d.categoria:'Outros',finalidade:d.finalidade||'',cartao_id:tipo==='cartao'?cart.id:undefined});
    toast(d.confianca==='baixa'?'Lido, mas a IA ficou na dúvida: confira':'Lido! Confira e salve');
  }catch(e){toast('Falha ao ler: '+e.message);abrirLanc(null,{})}
}
async function lerIA(p){const {data,error}=await sb.functions.invoke('ler-comprovante',{body:{base64:await b64(p.blob),mime:p.mime}});if(error||data?.erro)throw new Error(data?.erro||error.message);return data.dados||{}}
async function guardaArq(p,data){const path=S.uid+'/'+data.slice(0,7)+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+p.name.replace(/[^\w.\-]+/g,'_');const up=await sb.storage.from('comprovantes').upload(path,p.blob,{contentType:p.mime});if(up.error)throw new Error(up.error.message);return path}
function acharPendente(d){const v=Math.abs(+d.valor||0);if(!(v>0))return null;const c=pendentes().filter(l=>Math.abs(l.valor-v)<0.01);if(!c.length)return null;
  const n=(d.beneficiario||d.estabelecimento||'').toLowerCase();return c.find(l=>n&&((l.beneficiario||l.descricao||'').toLowerCase().split(' ').some(w=>w.length>3&&n.includes(w))))||c[0]}
async function pagaPendente(m,p,d){const dp=/^\d{4}-\d{2}-\d{2}$/.test(d.data||'')?d.data:hojeStr();const path=await guardaArq(p,dp);

async function criaPendente(p,d){const ehData=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');const v=Math.abs(+d.valor||0);if(!(v>0))throw new Error('valor não identificado');
  const venc=ehData(d.vencimento)?d.vencimento:(ehData(d.data)?d.data:hojeStr()),path=await guardaArq(p,venc),nome=d.beneficiario||d.estabelecimento||d.descricao||'Boleto';
  const r=await sb.from('lancamentos').insert({tipo:'saida',status:'pendente',descricao:nome,beneficiario:nome,valor:Math.round(v*100)/100,data:venc,vencimento:venc,categoria:CAT_S.includes(d.categoria)?d.categoria:'Outros',finalidade:d.finalidade||'',boleto_path:path});if(r.error)throw new Error(r.error.message)}
async function processaArquivos(files){
  files=[...files];if(files.length<2){return processaArquivo(files[0])}
  if(DEMO){toast('Modo demonstração');return}
  let bol=0,pag=0,novos=0;const falhas=[];
  for(let i=0;i<files.length;i++){const f=files[i];toast('Lendo '+(i+1)+' de '+files.length+'…');
    try{if(/\.(ofx|csv|txt|xlsx?)$/i.test(f.name))throw new Error('extrato: use Importar');
      const p=await prepara(f),d=await lerIA(p),ehData=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');
      if(d.documento==='boleto'){await criaPendente(p,d);bol++;continue}
      const m=acharPendente(d);
      if(m&&confirm('"'+f.name+'" parece o pagamento de "'+(m.beneficiario||m.descricao)+'" ('+BRL(m.valor)+'). Marcar como PAGO?')){await pagaPendente(m,p,d);pag++;continue}
      const v=Math.abs(+d.valor||0);if(!(v>0))throw new Error('valor não identificado');
      const dt=ehData(d.data)?d.data:hojeStr(),path=await guardaArq(p,dt),tipo=d.tipo==='entrada'?'entrada':'saida';
      const r=await sb.from('lancamentos').insert({tipo,status:'pago',descricao:d.estabelecimento||d.descricao||'Comprovante',beneficiario:d.beneficiario||null,valor:Math.round(v*100)/100,data:dt,categoria:(tipo==='entrada'?CAT_E:CAT_S).includes(d.categoria)?d.categoria:'Outros',finalidade:d.finalidade||'',comprovante:path});
      if(r.error)throw new Error(r.error.message);novos++;
    }catch(e){falhas.push(f.name+' ('+e.message+')')}}
  await carregar();ir(bol?'pagar':'lanc');
  toast(files.length+' arquivos: '+bol+' boletos a pagar, '+pag+' pagos, '+novos+' lançamentos'+(falhas.length?' · falhou: '+falhas[0]:''));
}

  <div class="two"><div><label>Cartão</label><select id="pdest">${S.cartoes.map(c=>'<option value="'+c.id+'">'+esc(c.nome)+'</option>').join('')}<option value="novo">+ Novo cartão (criar pela fatura)</option></select></div><div><label>Arquivo PDF</label><input type="file" id="pfile" accept=".pdf,application/pdf"></div></div>
  <button class="pri" style="margin-top:14px" onclick="lerFaturaPdf()">Ler fatura</button></div><div id="irev"></div>`;
  if(imp.rows.length)mostraRevisao();
}
async function lerTexto(file){const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes('�'))t=new TextDecoder('windows-1252').decode(buf);return t}
function parseOFX(t){
  const out=[];(t.match(/<STMTTRN>[\s\S]*?(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi)||[]).forEach(b=>{
    const g=k=>(b.match(new RegExp('<'+k+'>\\s*([^<\\r\\n]+)','i'))||[])[1];
    const d=(g('DTPOSTED')||'').trim(),v=parseFloat((g('TRNAMT')||'').replace(',','.'));
    if(d.length>=8&&!isNaN(v))out.push({data:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),desc:(g('MEMO')||g('NAME')||'').trim(),v,fitid:(g('FITID')||'').trim()||null})});
  return out}
function parseCSV(t){
  const linhas=t.split(/\r?\n/).filter(x=>x.trim());if(!linhas.length)return[];
  const sep=[';','\t',','].sort((a,b)=>linhas[0].split(b).length-linhas[0].split(a).length)[0];
  const cel=L=>{const r=[];let c='',q=false;for(const ch of L){if(ch==='"')q=!q;else if(ch===sep&&!q){r.push(c);c=''}else c+=ch}r.push(c);return r.map(x=>x.trim())};
  const rows=linhas.map(cel),norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const dataFmt=x=>{let m;if(m=x.match(/^(\d{2})\/(\d{2})\/(\d{4})/))return m[3]+'-'+m[2]+'-'+m[1];if(m=x.match(/^(\d{2})\/(\d{2})\/(\d{2})$/))return '20'+m[3]+'-'+m[2]+'-'+m[1];if(m=x.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[0].slice(0,10);return null};
  const hIdx=rows.findIndex(r=>r.some(x=>/^(data|date)/.test(norm(x)))&&r.some(x=>/(valor|amount|entrada|saida|quantia)/.test(norm(x))));
  const out=[];
  if(hIdx>=0){
    const h=rows[hIdx].map(norm),iD=h.findIndex(x=>/^(data|date)/.test(x)),iV=h.findIndex(x=>/(valor|amount|quantia)/.test(x)),iE=h.findIndex(x=>/^entrada/.test(x)),iS=h.findIndex(x=>/^saida/.test(x));
    const iDe=h.map((x,i)=>/(descri|title|titulo|historico|lancamento|memo|estabelec|detalhe)/.test(x)&&i!==iD?i:-1).filter(i=>i>=0);
    rows.slice(hIdx+1).forEach(c=>{const data=dataFmt(c[iD]||'');let v;
      if(iV>=0)v=num(c[iV]);else if(iE>=0&&iS>=0)v=(num(c[iE])||0)-(num(c[iS])||0);
      const desc=[...new Set(iDe.map(i=>c[i]).filter(Boolean))].join(' · ');
      if(data&&typeof v==='number'&&!isNaN(v)&&v!==0)out.push({data,desc,v,fitid:null})});
  }else rows.forEach(c=>{let data,v,desc='';c.forEach(x=>{const d=dataFmt(x);if(!data&&d)data=d;else if(v===undefined&&/^-?[R$\s]*-?\d[\d.]*(,\d{1,2})?$|^-?\d+\.\d{1,2}$/.test(x))v=num(x);else if(x.length>desc.length)desc=x});if(data&&typeof v==='number'&&!isNaN(v))out.push({data,desc,v,fitid:null})});
  return out}
function montaRevisao(itens,tipoDest,destId){
  let sinal=-1;if(tipoDest==='k'){const pos=itens.filter(i=>i.v>0).length,neg=itens.filter(i=>i.v<0).length;sinal=pos>neg?1:-1}
  return itens.map(i=>{let tipo,ok=true,aviso='',skip=false;
    if(tipoDest==='k'){if(Math.sign(i.v)===sinal)tipo='cartao';else{tipo='cartao';ok=false;skip=true;aviso='pagamento ou estorno'}}
    else tipo=i.v<0?'saida':'entrada';
    const dup=S.lanc.some(l=>(i.fitid&&l.fitid===i.fitid)||(l.data===i.data&&Math.abs(l.valor-Math.abs(i.v))<.005&&l.descricao===(i.desc||'Importado')&&(tipoDest==='k'?l.cartao_id===destId:l.conta_id===destId)));
    if(dup){ok=false;aviso='já importado'}
    return{...i,tipo,ok,skip,aviso,cat:adivinha(i.desc)||'Outros'}})}
async function leImport(){
  const f=$('ifile').files[0];if(!f){toast('Escolha o arquivo do banco');return}
  try{const t=await lerTexto(f),itens=/<STMTTRN>/i.test(t)?parseOFX(t):parseCSV(t);
    if(!itens.length){toast('Não consegui ler lançamentos desse arquivo. Tente o formato OFX.');return}
    const d=$('idest').value;imp={dest:d,destNome:$('idest').selectedOptions[0].text,arquivo:f.name,rows:montaRevisao(itens,d[0],d.slice(2))};mostraRevisao();
  }catch(e){toast('Erro ao ler: '+e.message)}
}
function mostraRevisao(){
  const r=imp.rows,n=r.filter(x=>x.ok).length,tot=r.filter(x=>x.ok).reduce((a,x)=>a+(x.tipo==='entrada'?x.v:-Math.abs(x.v)),0);
  $('irev').innerHTML=`<div class="card" style="margin-top:14px"><h3>Revisar: ${esc(imp.arquivo)} <span class="tag">${r.length} linhas · ${n} novas</span></h3>
  <div class="hint" style="margin-bottom:8px">Destino: <b>${esc(imp.destNome)}</b>. Linhas "já importado" e pagamentos de fatura vêm desmarcadas. Ajuste a categoria se quiser.</div>
  <div style="overflow:auto;max-height:55vh"><table><thead><tr><th></th><th>Data</th><th>Descrição</th><th>Categoria</th><th class="n">Valor</th></tr></thead><tbody>${r.map((x,i)=>`<tr style="${x.ok?'':'opacity:.55'}"><td><input type="checkbox" style="width:auto" ${x.ok?'checked':''} ${x.skip?'disabled':''} onchange="imp.rows[${i}].ok=this.checked;mostraRevisaoTotal()"></td><td>${x.data.slice(8)}/${x.data.slice(5,7)}/${x.data.slice(2,4)}</td><td>${esc(x.desc||'(sem descrição)')}${x.aviso?`<div class="hint">${x.aviso}</div>`:''}</td><td><select style="padding:6px" onchange="imp.rows[${i}].cat=this.value">${(x.tipo==='entrada'?CAT_E:CAT_S).map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></td><td class="n ${x.tipo==='entrada'?'pos':'neg'}"><b>${x.tipo==='entrada'?'+':'−'} ${BRL(Math.abs(x.v))}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><span id="irtot" class="hint">${n} selecionadas · resultado ${BRL(tot)}</span><div class="row"><button onclick="imp={dest:'',destNome:'',arquivo:'',rows:[]};vImport()">Cancelar</button><button class="pri" onclick="confirmaImport()">Importar selecionadas</button></div></div></div>`;
}
function mostraRevisaoTotal(){const s=imp.rows.filter(x=>x.ok);$('irtot').textContent=s.length+' selecionadas · resultado '+BRL(s.reduce((a,x)=>a+(x.tipo==='entrada'?x.v:-Math.abs(x.v)),0))}
async function confirmaImport(){
  const sel=imp.rows.filter(r=>r.ok);if(!sel.length){toast('Nada selecionado');return}
  if(DEMO){toast('Modo demonstração: nada é gravado');return}
  const t=imp.dest[0],id=imp.dest.slice(2);
  const r1=await sb.from('importacoes').insert({arquivo:imp.arquivo,destino:imp.destNome,qtd:sel.length}).select().single();
  if(r1.error){toast('Erro: '+r1.error.message);return}
  const rows=sel.map(r=>({tipo:r.tipo,descricao:r.desc||'Importado',valor:Math.round(Math.abs(r.v)*100)/100,data:r.data,categoria:r.cat,conta_id:t==='c'?id:null,cartao_id:t==='k'?id:null,importacao_id:r1.data.id,fitid:r.fitid}));
  for(let i=0;i<rows.length;i+=300){const r=await sb.from('lancamentos').insert(rows.slice(i,i+300));
    if(r.error){toast('Erro: '+r.error.message+' — nada foi mantido');await sb.from('importacoes').delete().eq('id',r1.data.id);return}}
  toast(sel.length+' lançamentos importados');imp={dest:'',destNome:'',arquivo:'',rows:[]};await recarrega();
}
async function desfazImport(id){if(!confirm('Desfazer esta importação? Os lançamentos que vieram dela serão apagados.'))return;
  if(await db(sb?.from('importacoes').delete().eq('id',id))){toast('Importação desfeita');recarrega()}}

// ---------- fatura em PDF ----------
let pdfImp=null;
async function textoPdf(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();let pdf=null,senha;
  for(let t=0;t<3;t++){
    try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),password:senha}).promise;break}
    catch(e){if(e&&e.name==='PasswordException'){senha=prompt(t?'Senha incorreta. Digite de novo:':'Este PDF tem senha. Digite a senha (ela fica só no seu computador):');if(senha===null)throw new Error('cancelado')}else throw e}}
  if(!pdf)throw new Error('não consegui abrir o PDF');
  const out=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i),tc=await pg.getTextContent();
    const it=tc.items.map(x=>({x:x.transform[4],y:Math.round(x.transform[5]),s:x.str})).filter(x=>x.s&&x.s.trim());
    it.sort((a,b)=>b.y-a.y||a.x-b.x);
    const linhas=[];let atual=null;
    it.forEach(x=>{if(!atual||Math.abs(x.y-atual.y)>3){atual={y:x.y,p:[]};linhas.push(atual)}atual.p.push(x)});
    out.push(linhas.map(l=>l.p.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ')).join('\n'));
  }
  return out.join('\n');
}
async function lerFaturaPdf(){
  const f=$('pfile').files[0];if(!f){toast('Escolha o PDF da fatura');return}
  if(DEMO){toast('Modo demonstração: sem leitura de fatura');return}
  toast('Lendo a fatura… pode levar até 1 minuto');
  try{
    const texto=await textoPdf(f);
    const {data,error}=await sb.functions.invoke('ler-fatura',{body:{texto}});
    let msg=data&&data.erro;if(error&&!msg){try{msg=(await error.context.json()).erro}catch(_e){msg=error.message}}
    if(msg){toast('IA: '+msg);return}
    pdfImp={fatura:data.fatura,arquivo:f.name,file:f,destino:$('pdest').value};
    montaPdfRevisao();
  }catch(e){toast(e.message==='cancelado'?'Cancelado':'Falha ao ler: '+e.message)}
}
function montaPdfRevisao(){
  const F=pdfImp.fatura,ls=(F.lancamentos||[]).map(x=>({...x,valor:Math.abs(+x.valor||0)}));
  const usados=new Set();
  ls.forEach((x,i)=>{x.skip=false;x.aviso='';
    if(x.tipo==='pagamento'){x.skip=true;x.aviso='pagamento da fatura anterior'}
    else if(x.tipo==='credito'){const j=ls.findIndex((y,k)=>k!==i&&!usados.has(k)&&(y.tipo==='compra'||y.tipo==='encargo')&&Math.abs(y.valor-x.valor)<.005&&(y.final||'')===(x.final||''));
      if(j>=0){usados.add(j);ls[j].skip=true;ls[j].aviso='estornado';x.skip=true;x.aviso='estorno'}else{x.skip=true;x.aviso='crédito (já está no total)'}}});
  ls.forEach(x=>{x.ok=!x.skip});
  const c=S.cartoes.find(c=>c.id===pdfImp.destino);pdfImp.linhas=ls;pdfImp.sync=!!(c&&c.pluggy_id);
  pdfImp.ok=!pdfImp.sync;
  mostraPdfRevisao();
}
function somaPdf(){return pdfImp.linhas.filter(x=>x.ok).reduce((a,x)=>a+x.valor,0)}
function mostraPdfRevisao(){
  const F=pdfImp.fatura,ls=pdfImp.linhas,soma=somaPdf(),dif=(+F.total||0)-soma;
  $('irev').innerHTML=`<div class="card" style="margin-top:14px"><h3>Fatura ${esc(F.banco||'')} ${esc(F.cartao_nome||'')} <span class="tag">total ${BRL(F.total)} · vence ${fmtData(F.vencimento)}</span></h3>
  <div class="hint" style="margin-bottom:8px">${ls.length} linhas lidas. Confira se está tudo certo antes de guardar. O valor oficial da fatura (${BRL(F.total)}) também é guardado.</div>
  ${pdfImp.sync?`<label style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" style="width:auto" ${pdfImp.ok?'checked':''} onchange="pdfImp.ok=this.checked"> Este cartão já é sincronizado pelo banco. Marque só se quiser importar também as linhas do PDF.</label>`:''}
  <div style="overflow:auto;max-height:55vh"><table><thead><tr><th></th><th>Data</th><th>Descrição</th><th>Final</th><th class="n">Valor</th></tr></thead><tbody>${ls.map((x,i)=>`<tr style="${x.ok?'':'opacity:.55'}"><td><input type="checkbox" style="width:auto" ${x.ok?'checked':''} ${x.skip&&x.tipo==='pagamento'?'disabled':''} onchange="pdfImp.linhas[${i}].ok=this.checked;pdfTot()"></td><td>${fmtData(x.data)}</td><td>${esc(x.descricao)}${x.parcela?' <span class="hint">'+esc(x.parcela)+'</span>':''}${x.aviso?'<div class="hint">'+x.aviso+'</div>':''}</td><td>${esc(x.final||'')}</td><td class="n ${x.tipo==='compra'||x.tipo==='encargo'?'':'pos'}"><b>${BRL(x.valor)}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><span id="pdftot" class="hint"></span><div class="row"><button onclick="pdfImp=null;vImport()">Cancelar</button><button class="pri" onclick="confirmaPdf()">Guardar fatura</button></div></div></div>`;
  pdfTot();
}
function pdfTot(){const F=pdfImp.fatura,s=somaPdf(),d=(+F.total||0)-s;$('pdftot').textContent=pdfImp.linhas.filter(x=>x.ok).length+' linhas · soma '+BRL(s)+' · '+(Math.abs(d)<.01?'bate com o total da fatura':'diferença para o total: '+BRL(d))}
async function confirmaPdf(){
  if(DEMO){toast('Modo demonstração: nada é gravado');return}
  const F=pdfImp.fatura;let cartaoId=pdfImp.destino,nomeCartao='';
  try{
    if(cartaoId==='novo'){
      const nome=(((F.banco||'')+' '+(F.cartao_nome||'')).trim())||'Cartão novo';
      const r=await sb.from('cartoes').insert({nome,fechamento:+(F.fechamento||'').slice(8,10)||25,vencimento:+(F.vencimento||'').slice(8,10)||5,limite:0}).select().single();
      if(r.error)throw new Error(r.error.message);cartaoId=r.data.id;nomeCartao=nome;
    }else nomeCartao=(S.cartoes.find(c=>c.id===cartaoId)||{}).nome||'';
    const dataFat=F.fechamento||F.vencimento,mes=dataFat.slice(0,7);
    const sel=pdfImp.ok?pdfImp.linhas.filter(x=>x.ok):[];
    const path=await guardaArq({blob:pdfImp.file,mime:'application/pdf',name:pdfImp.arquivo},dataFat);
    const im=await sb.from('importacoes').insert({arquivo:pdfImp.arquivo,destino:nomeCartao,qtd:sel.length,arquivo_path:path}).select().single();
    if(im.error)throw new Error(im.error.message);
    const fo=await sb.from('faturas_oficiais').upsert({cartao_id:cartaoId,mes,valor:+F.total},{onConflict:'cartao_id,mes'});
    if(fo.error)throw new Error(fo.error.message);
    const rows=sel.map((x,i)=>{const pm=(x.parcela||'').match(/^(\d+)\/(\d+)$/);return{tipo:'cartao',descricao:x.descricao||'Sem descrição',valor:Math.round(x.valor*100)/100,data:x.data,categoria:adivinha(x.descricao)||'Outros',cartao_id:cartaoId,importacao_id:im.data.id,fitid:'pdf:'+cartaoId+':'+mes+':'+i,cartao_final:x.final||null,data_fatura:dataFat,parcela_num:pm?+pm[1]:null,parcela_total:pm?+pm[2]:null}});
    for(let i=0;i<rows.length;i+=300){const r=await sb.from('lancamentos').insert(rows.slice(i,i+300));if(r.error)throw new Error(r.error.message)}
    toast('Fatura guardada: '+rows.length+' lançamentos e valor oficial '+BRL(F.total));pdfImp=null;await recarrega();
  }catch(e){toast('Erro: '+e.message)}
}
