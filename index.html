<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--navy:#0a1f4d;--navy2:#13306e;--bg:#eef2f8;--card:#fff;--tx:#0e1b3d;--mut:#6b7794;--line:#e3e8f2;--ac:#1fd6a8;--ac2:#0fb38a;--red:#e5484d;--grn:#12a37f;--pur:#7c5cff;--org:#f97316;--r:18px}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px}
button.pri{background:var(--ac);border-color:var(--ac);color:#04281f;font-weight:700}
button.dan{color:var(--red)}
button.sm{padding:5px 10px;font-size:13px;border-radius:9px}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy),#071433)}
.lbox{background:#fff;border-radius:22px;padding:28px;width:100%;max-width:380px}
.lbox h1{margin:0 0 4px;font-size:24px}.lbox p{margin:0 0 16px;color:var(--mut)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
/* app */
.app{display:grid;grid-template-columns:250px 1fr;gap:18px;padding:18px;min-height:100vh}
aside{background:linear-gradient(180deg,var(--navy),#08183b);border-radius:26px;padding:20px 14px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;color:#c9d6f5}
.brand{font-weight:800;font-size:19px;color:#fff;padding:6px 10px 18px;display:flex;align-items:center;gap:10px}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--ac);display:grid;place-items:center;color:#04281f;font-style:normal}
nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;color:#c9d6f5;margin-bottom:4px;font-weight:600}
nav a.on{background:var(--ac);color:#04281f}
nav a:hover:not(.on){background:#ffffff14}
.sp{flex:1}
main{min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{margin:0;font-size:26px}.top small{color:var(--mut);display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mes{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px}
.mes button{border:0;background:none;font-size:18px;padding:8px 14px}.mes b{min-width:140px;text-align:center;display:block}.mes b::first-letter,.cap::first-letter{text-transform:uppercase}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr;margin-top:14px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px #0a1f4d0d,0 8px 24px #0a1f4d0a}
.card h3{margin:0 0 14px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{color:var(--mut);font-weight:600}.kpi .v{font-size:27px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--mut)}
.pos{color:var(--grn)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid #f0f3f9}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:#eef2fb;color:#44527a;white-space:nowrap;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f9}.item:last-child{border:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.item .nm{flex:1;min-width:0}.item .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .nm small{color:var(--mut)}
.bar{height:7px;background:#e8edf7;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--mut)}
.stk{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:#f1f4fa}
.col.cur .stk{outline:2px solid var(--navy)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{color:var(--mut);text-align:center;padding:26px 0}
.modal{position:fixed;inset:0;background:#0a1f4d88;display:none;align-items:center;justify-content:center;padding:14px;z-index:30}.modal.on{display:flex}
.box{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:470px;max-height:94vh;overflow:auto}.box h2{margin:0 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;display:none;z-index:40;max-width:90vw;text-align:center}
.fab{display:none}
.hint{color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools>*{flex:1;min-width:120px}
.demo{background:#fff3cd;color:#664d03;text-align:center;padding:6px;font-size:13px}
@media(max-width:980px){.k4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{display:block;padding:12px 12px 100px}
  aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;border-radius:20px 20px 0 0;flex-direction:row;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .brand,.sp,aside .out{display:none}
  nav{display:flex;width:100%;justify-content:space-around}
  nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;margin:0}
  .top h1{font-size:22px}
  .mes{width:100%;justify-content:space-between}
  .fab{display:flex;position:fixed;right:14px;bottom:86px;z-index:25;background:var(--ac);color:#04281f;border:0;border-radius:99px;padding:14px 18px;font-weight:800;box-shadow:0 8px 24px #0a1f4d55;gap:8px;align-items:center}
  th:nth-child(3),td:nth-child(3){display:none}
  .toast{bottom:150px}
}
@media(max-width:520px){.k4{grid-template-columns:1fr}.kpi .v{font-size:24px}.card{padding:16px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="demoBar" class="demo hide">Modo demonstração: dados de exemplo, nada é gravado.</div>

<div id="login" class="hide">
  <form class="lbox" id="lform">
    <h1>Financeiro</h1><p>Entre com o seu e-mail e senha.</p>
    <label>E-mail</label><input id="lemail" type="email" autocomplete="username" required>
    <label>Senha</label><input id="lsenha" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="pri" style="width:100%;margin-top:6px" type="submit">Entrar</button>
  </form>
</div>

<div class="app hide" id="app">
  <aside>
    <div class="brand"><i>$</i> Financeiro</div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <nav class="out"><a onclick="sair()"><span>↩</span> Sair</a></nav>
  </aside>
  <main>
    <div class="top">
      <div><h1 id="tit">Início</h1><small id="sub"></small></div>
      <div class="row">

        <button class="sm" onclick="sair()" id="btnSair">Sair</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<button class="fab hide" id="fab" onclick="$('arq').click()">📎 Comprovante</button>
<input type="file" id="arq" accept="image/*,.pdf" class="hide" onchange="processaArquivo(this.files[0]);this.value=''">
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://nlwyjcxunyxzmcqwtymn.supabase.co',SB_KEY='sb_publishable_vUhozeC7cgFzc9ORL4Z4Qw_YXM6QfI_';
const DEMO=location.hash==='#demo';
const sb=DEMO?null:supabase.createClient(SB_URL,SB_KEY);
const CAT_S=['Supermercado','Alimentação','Combustível','Moradia','Contas fixas','Saúde','Transporte','Lazer','Educação','Assinaturas','Compras','Impostos','Outros'];
const CAT_E=['Salário','Vendas / TB','Rendimentos','Outros'];
const CORES=['#1fd6a8','#f97316','#7c5cff','#38bdf8','#e5484d','#eab308','#14b8a6','#ec4899'];
const PALAVRAS={Supermercado:['mercado','supermerc','atacad','assai','carrefour','hortifruti','sacolao'],Alimentação:['restaurante','lanche','ifood','pizza','padaria','burger','cafe','acai'],Combustível:['posto','shell','ipiranga','gasolina','etanol'],Transporte:['uber','99','pedagio','estacion'],Saúde:['farmacia','drogaria','clinica','consulta'],Assinaturas:['netflix','spotify','youtube','prime','disney'],Moradia:['aluguel','condominio','iptu','energia','agua','internet']};
let S={uid:null,email:'',cartoes:[],fixas:[],lanc:[],contas:[],importacoes:[],saldoInicial:0};
let view='inicio',ym='',pend=null,tipoSel='saida';
const $=id=>document.getElementById(id);
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mesAtual(){return hojeStr().slice(0,7)}
function addMes(m,n){let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+pad(mo)}
function diasNoMes(m){const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function addMesData(d,n){const m=addMes(d.slice(0,7),n);return m+'-'+pad(Math.min(+d.slice(8,10),diasNoMes(m)))}
const nomeMes=m=>new Date(m+'-15T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const mesCurto=m=>new Date(m+'-15T12:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase();
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}

// ---------- dados ----------
const cartao=id=>S.cartoes.find(c=>c.id===id);
const corCartao=id=>{const i=S.cartoes.findIndex(c=>c.id===id);return CORES[(i<0?0:i)%CORES.length]};
async function carregar(){
  if(DEMO){demo();return}
  const [c,f,l,g,ct,im]=await Promise.all([
    sb.from('cartoes').select('*').order('criado_em'),
    sb.from('fixas').select('*').order('dia'),
    todos(()=>sb.from('lancamentos').select('*').order('data',{ascending:false}).order('id')),
    sb.from('config').select('*').maybeSingle(),
    sb.from('contas').select('*').order('criado_em'),
    sb.from('importacoes').select('*').order('criado_em',{ascending:false}).limit(30)]);
  const e=c.error||f.error||l.error||g.error||ct.error||im.error;if(e){toast('Erro ao carregar: '+e.message);return}
  S.cartoes=c.data;S.fixas=f.data;S.lanc=l.data.map(x=>({...x,valor:+x.valor}));S.contas=ct.data;S.importacoes=im.data;
  S.saldoInicial=+(g.data?.saldo_inicial||0)+S.contas.reduce((a,x)=>a+ +x.saldo_inicial,0);
  S.ultimaSync=g.data?.ultima_sync||null;
}
let sincronizando=false;
async function sincronizar(silencioso){
  if(DEMO){toast('Modo demonstração: sem sincronização');return}
  if(sincronizando)return;sincronizando=true;
  if(!silencioso)toast('Sincronizando com os bancos… pode levar até 1 minuto');
  try{
    const {data,error}=await sb.functions.invoke('sincronizar-bancos',{body:{}});
    let msg=data&&data.erro;
    if(error&&!msg){try{msg=(await error.context.json()).erro}catch(_e){msg=error.message}}
    if(msg){toast('Sincronização: '+msg);return}
    const av=data.avisos||[];
    toast('Sincronizado: '+data.novos+' lançamentos novos'+((data.contas||data.cartoes)?' · '+data.contas+' contas e '+data.cartoes+' cartões encontrados':'')+(av.length?' · aviso: '+av[0]:''));
    await carregar();render();
  }catch(e){toast('Sincronização falhou: '+e.message)}finally{sincronizando=false}
}
function textoSync(){if(!S.ultimaSync)return 'ainda não sincronizou';const h=(Date.now()-new Date(S.ultimaSync).getTime())/36e5;return h<1?'há menos de 1 hora':h<48?'há '+Math.round(h)+' horas':'há '+Math.round(h/24)+' dias'}
async function todos(q){let out=[],from=0;for(;;){const r=await q().range(from,from+999);if(r.error)return r;out=out.concat(r.data);if(r.data.length<1000)break;from+=1000}return{data:out,error:null}}
function demo(){
  const h=hojeStr(),m=h.slice(0,7);let k=0;const id=()=> 'd'+(++k);
  S.cartoes=[{id:'c1',nome:'Nubank Ultravioleta',fechamento:25,vencimento:2,limite:12000},{id:'c2',nome:'Itaú Click',fechamento:20,vencimento:27,limite:6000},{id:'c3',nome:'Inter Black',fechamento:28,vencimento:5,limite:8000}];
  S.fixas=[{id:'f1',descricao:'Aluguel',valor:2200,dia:5,categoria:'Moradia'},{id:'f2',descricao:'Internet',valor:119.9,dia:12,categoria:'Moradia'},{id:'f3',descricao:'Energia',valor:310,dia:+h.slice(8,10)+3>28?28:+h.slice(8,10)+3,categoria:'Moradia'}];
  S.lanc=[];S.contas=[{id:'a1',nome:'C6 Bank PJ',tipo:'corrente',saldo_inicial:5000},{id:'a2',nome:'Santander',tipo:'corrente',saldo_inicial:3000}];S.importacoes=[{id:'i1',arquivo:'extrato-c6-outubro.ofx',destino:'C6 Bank PJ',qtd:42,criado_em:new Date().toISOString()}];S.saldoInicial=8000;
  const L=(o)=>S.lanc.push({id:id(),finalidade:'',descricao:'',categoria:'Outros',...o});
  L({tipo:'entrada',descricao:'Vendas TB',valor:10900,data:m+'-05',categoria:'Vendas / TB'});
  L({tipo:'saida',descricao:'Mercado do bairro',valor:432.1,data:m+'-08',categoria:'Supermercado',finalidade:'compras do mês'});
  L({tipo:'saida',descricao:'Padaria',valor:2.55,data:m+'-09',categoria:'Alimentação'});
  L({tipo:'cartao',descricao:'Posto Shell',valor:210,data:m+'-10',categoria:'Combustível',cartao_id:'c1'});
  const P=(desc,tot,n,atual,c)=>{const g='g'+desc;for(let i=1;i<=n;i++){const d=addMesData(m+'-10',i-atual);L({tipo:'cartao',descricao:desc,valor:+(tot/n).toFixed(2),data:d,categoria:'Compras',cartao_id:c,parcela_grupo:g,parcela_num:i,parcela_total:n})}};
  P('Notebook Dell',4799,10,4,'c1');P('Geladeira',3588,12,3,'c2');P('Sofá retrátil',2890,5,1,'c1');P('Passagens Recife',1740,6,1,'c3');
}
function mesFatura(l){const c=cartao(l.cartao_id);const m=l.data.slice(0,7);if(!c)return m;return +l.data.slice(8,10)>(+c.fechamento||31)?addMes(m,1):m}
function vencimento(c,m){const base=c.vencimento>c.fechamento?m:addMes(m,1);return base+'-'+pad(Math.min(c.vencimento,diasNoMes(base)))}
function resumo(m){
  let ent=0,sai=0,cart=0,fat=0;const cat={};
  S.lanc.forEach(l=>{const lm=l.data.slice(0,7);
    if(l.tipo==='entrada'&&lm===m)ent+=l.valor;
    if(l.tipo==='saida'&&lm===m){sai+=l.valor;cat[l.categoria]=(cat[l.categoria]||0)+l.valor}
    if(l.tipo==='cartao'&&lm===m){cart+=l.valor;cat[l.categoria]=(cat[l.categoria]||0)+l.valor}
    if(l.tipo==='cartao'&&mesFatura(l)===m)fat+=l.valor});
  return{ent,desp:sai+cart,fat,cat}
}
function caixaAte(m){let t=S.saldoInicial;S.lanc.forEach(l=>{const lm=l.data.slice(0,7);
  if(l.tipo==='entrada'&&lm<=m)t+=l.valor;else if(l.tipo==='saida'&&lm<=m)t-=l.valor;else if(l.tipo==='cartao'&&mesFatura(l)<=m)t-=l.valor});return t}
const fixaPaga=(f,m)=>S.lanc.some(l=>l.fixa_id===f.id&&l.data.startsWith(m));
function projecao(m){ // comprometido no mês m
  const porCartao=S.cartoes.map(c=>({c,v:S.lanc.filter(l=>l.tipo==='cartao'&&l.cartao_id===c.id&&mesFatura(l)===m).reduce((a,l)=>a+l.valor,0)}));
  const atual=mesAtual();const contas=S.fixas.filter(f=>m>atual||(m===atual&&!fixaPaga(f,m))).reduce((a,f)=>a+f.valor,0);
  return{porCartao,contas,total:porCartao.reduce((a,x)=>a+x.v,0)+contas}
}
function parcelas(){
  const g={};S.lanc.filter(l=>l.parcela_grupo).forEach(l=>(g[l.parcela_grupo]??=[]).push(l));
  const atual=mesAtual();
  return Object.values(g).map(a=>{a.sort((x,y)=>x.parcela_num-y.parcela_num);
    const pagas=a.filter(l=>mesFatura(l)<atual),rest=a.filter(l=>mesFatura(l)>=atual);
    return{nome:a[0].descricao,cartao:a[0].cartao_id,total:a.reduce((s,l)=>s+l.valor,0),falta:rest.reduce((s,l)=>s+l.valor,0),n:a[0].parcela_total,feitas:pagas.length,prox:rest[0]?.data}
  }).filter(p=>p.falta>0).sort((a,b)=>b.falta-a.falta)
}
function agenda(){
  const out=[],h=hojeStr(),fim=addMesData(h,0);const hoje=new Date(h+'T12:00'),lim=new Date(hoje.getTime()+7*864e5);
  const dt=s=>new Date(s+'T12:00'),dentro=s=>dt(s)>=hoje&&dt(s)<=lim;
  [mesAtual(),addMes(mesAtual(),1)].forEach(m=>{
    S.fixas.forEach(f=>{const d=m+'-'+pad(Math.min(f.dia,diasNoMes(m)));if(dentro(d)&&!fixaPaga(f,m))out.push({d,nome:f.descricao,sub:'Conta fixa',v:-f.valor})});
    S.cartoes.forEach(c=>{[addMes(m,-1),m].forEach(fm=>{const d=vencimento(c,fm);if(dentro(d)&&d.slice(0,7)===m){const v=S.lanc.filter(l=>l.tipo==='cartao'&&l.cartao_id===c.id&&mesFatura(l)===fm).reduce((a,l)=>a+l.valor,0);if(v>0&&!out.some(o=>o.d===d&&o.nome==='Fatura '+c.nome))out.push({d,nome:'Fatura '+c.nome,sub:'Cartão',v:-v})}})})
  });
  return out.sort((a,b)=>a.d.localeCompare(b.d))
}

// ---------- telas ----------
const NAV=[['inicio','🏠','Início'],['lanc','🧾','Lançamentos'],['proj','📈','Projeção'],['contas','🏦','Contas'],['cartoes','💳','Cartões'],['fixas','🔁','Fixas'],['import','⬆️','Importar']];
function render(){
  $('nav').innerHTML=NAV.map(([k,i,t])=>`<a class="${k===view?'on':''}" onclick="ir('${k}')"><span>${i}</span>${t}</a>`).join('');
  $('mesTxt').textContent=nomeMes(ym);
  const nome=(S.email||'').split('@')[0];
  $('tit').textContent=view==='inicio'?'Olá, '+(nome||'Emanuel'):NAV.find(n=>n[0]===view)[2];
  $('sub').textContent=view==='inicio'?'Aqui está o resumo das suas finanças · '+nomeMes(ym):'';

// ---------- radar: leitura de 10 segundos ----------
function radar(){
  const out=[],h=hojeStr(),dia=+h.slice(8),m=mesAtual(),dias=d=>Math.round((new Date(h+'T12:00')-new Date(d+'T12:00'))/864e5);
  const gasto=(mm,ate)=>S.lanc.filter(l=>(l.tipo==='saida'||l.tipo==='cartao')&&l.data.startsWith(mm)&&+l.data.slice(8)<=ate).reduce((a,l)=>a+l.valor,0);
  const prev=[1,2].map(i=>gasto(addMes(m,-i),dia)).filter(x=>x>0),media=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:0,atual=gasto(m,dia);
  if(media>0){const p=Math.round((atual/media-1)*100);out.push({n:Math.abs(p)<10?'ok':p>0?'alerta':'ok',t:`Até o dia ${dia} você gastou ${BRL(atual)}: ${Math.abs(p)<10?'no ritmo da média':p>0?p+'% acima da média':(-p)+'% abaixo da média'} dos meses anteriores (${BRL(media)}).`})}
  else if(atual>0)out.push({n:'info',t:`Até o dia ${dia} você gastou ${BRL(atual)}. Faltam meses anteriores para comparar o ritmo.`});
  const catMes=(mm)=>{const c={};S.lanc.filter(l=>(l.tipo==='saida'||l.tipo==='cartao')&&l.data.startsWith(mm)&&+l.data.slice(8)<=dia).forEach(l=>c[l.categoria]=(c[l.categoria]||0)+l.valor);return c};
  const ca=catMes(m),cp=catMes(addMes(m,-1));let top=null;Object.entries(ca).forEach(([k,v])=>{const base=cp[k]||0;if(v>300&&v>base*1.3&&(!top||v-base>top.d))top={k,v,base,d:v-base}});
  if(top)out.push({n:'alerta',t:`${top.k} subiu: ${BRL(top.v)} neste mês contra ${BRL(top.base)} no mesmo período do mês passado.`});
  S.cartoes.forEach(c=>{const f=S.lanc.filter(l=>l.tipo==='cartao'&&l.cartao_id===c.id&&mesFatura(l)===m).reduce((a,l)=>a+l.valor,0);if(+c.limite>0&&f/c.limite>=.8)out.push({n:'alerta',t:`A fatura do ${c.nome} já usa ${Math.round(f/c.limite*100)}% do limite (${BRL(f)} de ${BRL(c.limite)}).`})});
  agenda().slice(0,3).forEach(a=>{const d=Math.max(0,-dias(a.d));out.push({n:'info',t:`${a.nome} vence ${d===0?'hoje':d===1?'amanhã':'em '+d+' dias'}: ${BRL(-a.v)}.`})});
  if(!DEMO&&S.contas.some(c=>c.pluggy_id)||S.ultimaSync){const h=S.ultimaSync?(Date.now()-new Date(S.ultimaSync).getTime())/36e5:1e9;if(h>48)out.push({n:'alerta',t:'A sincronização automática dos bancos está parada ('+textoSync()+'). Abra Contas e toque em Sincronizar bancos.'})}
  S.contas.forEach(c=>{if(c.pluggy_id&&S.ultimaSync&&(Date.now()-new Date(S.ultimaSync).getTime())<1728e5)return;const ds=S.lanc.filter(l=>l.conta_id===c.id).map(l=>l.data).sort(),ult=ds[ds.length-1];
    if(!ult)out.push({n:'info',t:`A conta ${c.nome} ainda não tem lançamentos. Importe o extrato.`});
    else if(dias(ult)>7)out.push({n:'alerta',t:`A conta ${c.nome} está sem lançamentos há ${dias(ult)} dias. Importe o extrato mais recente.`});
    if(saldoConta(c)<0)out.push({n:'alerta',t:`O saldo calculado de ${c.nome} está negativo (${BRL(saldoConta(c))}). Use "Ajustar saldo" em Contas.`})});
  if(!out.length)out.push({n:'ok',t:'Tudo tranquilo por aqui. Nada fora do normal hoje.'});
  return out;
}

async function gravarLanc(id){
  const v=num($('fv').value);if(!(v>0)){toast('Informe um valor maior que zero');return}
  if(DEMO){toast('Modo demonstração: nada é gravado');return}
  const data=$('fdt').value||hojeStr();
  const base={tipo:tipoSel,descricao:$('fd').value.trim()||'Sem descrição',finalidade:$('ffin').value.trim(),categoria:$('fc').value,cartao_id:tipoSel==='cartao'?($('fcart').value||null):null,conta_id:tipoSel!=='cartao'?($('fconta').value||null):null};
  let comp=null;
  if(pend){const path=S.uid+'/'+data.slice(0,7)+'/'+Date.now()+'_'+pend.name.replace(/[^\w.\-]+/g,'_');
    const up=await sb.storage.from('comprovantes').upload(path,pend.blob,{contentType:pend.mime});
    if(up.error){toast('Falha ao guardar o comprovante: '+up.error.message);return}comp=path}
  let r;
  if(id){const o={...base,valor:Math.round(v*100)/100,data};if(comp)o.comprovante=comp;r=await sb.from('lancamentos').update(o).eq('id',id)}
  else{const np=tipoSel==='cartao'?Math.max(1,Math.min(48,+$('fp').value||1)):1;const rows=[];
    if(np>1){const g=crypto.randomUUID(),cent=Math.round(v*100),par=Math.floor(cent/np);
      for(let i=0;i<np;i++)rows.push({...base,valor:(i===np-1?cent-par*(np-1):par)/100,data:addMesData(data,i),parcela_grupo:g,parcela_num:i+1,parcela_total:np,comprovante:i===0?comp:null})}
    else rows.push({...base,valor:Math.round(v*100)/100,data,comprovante:comp});
    r=await sb.from('lancamentos').insert(rows)}
  if(r.error){toast('Erro: '+r.error.message);return}
  pend=null;fechar();toast('Lançamento salvo');recarrega();
}
async function apagarLanc(id){const l=S.lanc.find(x=>x.id===id);let ids=[id];
  if(l.parcela_grupo&&confirm('Isso faz parte de uma compra parcelada. OK = apagar TODAS as parcelas. Cancelar = apagar só esta.'))ids=S.lanc.filter(x=>x.parcela_grupo===l.parcela_grupo).map(x=>x.id);
  else if(!l.parcela_grupo&&!confirm('Excluir este lançamento?'))return;
  if(DEMO){toast('Modo demonstração: nada é gravado');return}
  const r=await sb.from('lancamentos').delete().in('id',ids);if(r.error){toast('Erro: '+r.error.message);return}fechar();recarrega()}
async function verComp(path){if(DEMO){toast('Modo demonstração');return}const w=window.open('','_blank');const r=await sb.storage.from('comprovantes').createSignedUrl(path,120);if(r.error){w.close();toast('Não achei o arquivo');return}w.location=r.data.signedUrl}

// ---------- comprovante + IA ----------
async function prepara(file){
  if(file.type==='application/pdf')return{blob:file,mime:file.type,name:file.name};
  const bmp=await createImageBitmap(file),esc_=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*esc_);cv.height=Math.round(bmp.height*esc_);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));return{blob,mime:'image/jpeg',name:file.name.replace(/\.\w+$/,'')+'.jpg'}}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
async function processaArquivo(file){
  if(!file)return;
  if(/\.(ofx|csv|txt|xlsx?)$/i.test(file.name)){toast('Isso é um extrato: use a aba Importar');ir('import');return}
  if(DEMO){toast('Modo demonstração: a IA fica ligada só com login');return}
  toast('Lendo o comprovante…');
  try{pend=await prepara(file);
    const {data,error}=await sb.functions.invoke('ler-comprovante',{body:{base64:await b64(pend.blob),mime:pend.mime}});
    if(error||data?.erro){toast('IA: '+(data?.erro||error.message)+' — preencha na mão');abrirLanc(null,{});return}
    const d=data.dados||{},cart=S.cartoes[0],tipo=d.tipo==='entrada'?'entrada':(d.forma==='cartao'&&cart?'cartao':'saida');
    abrirLanc(null,{tipo,descricao:d.estabelecimento||d.descricao||'',valor:d.valor||'',data:/^\d{4}-\d{2}-\d{2}$/.test(d.data)?d.data:hojeStr(),categoria:(tipo==='entrada'?CAT_E:CAT_S).includes(d.categoria)?d.categoria:'Outros',finalidade:d.finalidade||'',cartao_id:tipo==='cartao'?cart.id:undefined});
    toast(d.confianca==='baixa'?'Lido, mas a IA ficou na dúvida: confira':'Lido! Confira e salve');
  }catch(e){toast('Falha ao ler: '+e.message);abrirLanc(null,{})}
}
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])][0];if(f&&!$('modal').classList.contains('on')&&!$('app').classList.contains('hide'))processaArquivo(f)});

// ---------- contas ----------
function saldoConta(c){let t=+c.saldo_inicial;S.lanc.forEach(l=>{if(l.conta_id===c.id)t+=l.tipo==='entrada'?l.valor:(l.tipo==='saida'?-l.valor:0)});return t}
function vContas(){
  const tot=S.contas.reduce((a,c)=>a+saldoConta(c),0);
  $('view').innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><b>🔄 Bancos conectados (Meu Pluggy)</b><div class="hint">Última sincronização: ${textoSync()}. Atualiza contas pessoais, cartões e lançamentos dos últimos 90 dias, sem duplicar.</div></div><button class="pri" onclick="sincronizar()">Sincronizar bancos agora</button></div></div>
  <div class="grid g2" style="margin-top:0"><div class="card"><h3>Suas contas <span class="tag">${BRL(tot)}</span></h3>${S.contas.map(c=>`<div class="item"><div class="ico" style="background:var(--navy)">🏦</div><div class="nm"><b>${esc(c.nome)}</b><small>saldo inicial ${BRL(c.saldo_inicial)}</small></div><b class="${saldoConta(c)<0?'neg':''}">${BRL(saldoConta(c))}</b><button class="sm" onclick="ajustaSaldo('${c.id}')">Ajustar saldo</button><button class="sm dan" onclick="delItem('contas','${c.id}','conta')">✕</button></div>`).join('')||'<div class="empty">Cadastre a conta do banco (ex.: C6 Bank PJ)</div>'}</div>
  <div class="card"><h3>Nova conta</h3><label>Nome</label><input id="an" placeholder="Ex.: C6 Bank PJ"><label>Saldo inicial (hoje, antes de importar)</label><input id="as" inputmode="decimal" placeholder="0,00"><div class="hint" style="margin-top:8px">O saldo da conta = saldo inicial + entradas − saídas lançadas nela. Ao importar o extrato, use o saldo de antes do primeiro lançamento do arquivo.</div><button class="pri" style="margin-top:14px" onclick="addConta()">Adicionar conta</button></div></div>`;
}
async function ajustaSaldo(id){
  const c=S.contas.find(x=>x.id===id),v=prompt('Qual é o saldo desta conta HOJE no banco? (R$)\nO painel ajusta o saldo inicial para bater.');if(v===null)return;
  const atual=num(v);if(isNaN(atual))return;const mov=saldoConta(c)-(+c.saldo_inicial);
  if(await db(sb?.from('contas').update({saldo_inicial:Math.round((atual-mov)*100)/100}).eq('id',id))){toast('Saldo ajustado');recarrega()}}
async function addConta(){const n=$('an').value.trim();if(!n){toast('Dê um nome à conta');return}
  if(await db(sb?.from('contas').insert({nome:n,saldo_inicial:num($('as').value)||0})))recarrega()}

// ---------- importar extrato / fatura ----------
let imp={dest:'',destNome:'',arquivo:'',rows:[]};
function vImport(){
  const ops=(S.contas.length?`<optgroup label="Conta bancária">${S.contas.map(c=>`<option value="c:${c.id}">${esc(c.nome)}</option>`).join('')}</optgroup>`:'')+(S.cartoes.length?`<optgroup label="Cartão de crédito (fatura)">${S.cartoes.map(c=>`<option value="k:${c.id}">${esc(c.nome)}</option>`).join('')}</optgroup>`:'');
  $('view').innerHTML=`<div class="grid g2" style="margin-top:0"><div class="card"><h3>Importar extrato ou fatura</h3>
  <p class="hint">Baixe o arquivo <b>OFX</b> (melhor) ou <b>CSV</b> no app ou site do banco. Nada é gravado antes da sua revisão, e dá para desfazer.</p>
  ${ops?`<label>Os lançamentos são de:</label><select id="idest">${ops}</select><label>Arquivo</label><input type="file" id="ifile" accept=".ofx,.csv,.txt"><button class="pri" style="margin-top:14px" onclick="leImport()">Ler arquivo</button>`:'<div class="empty">Cadastre antes uma <a class="hint" style="cursor:pointer;text-decoration:underline" onclick="ir(\'contas\')">conta</a> ou um <a class="hint" style="cursor:pointer;text-decoration:underline" onclick="ir(\'cartoes\')">cartão</a>.</div>'}</div>
  <div class="card"><h3>Importações recentes</h3>${S.importacoes.map(i=>`<div class="item"><div class="nm"><b>${esc(i.arquivo)}</b><small>${esc(i.destino)} · ${i.qtd} lançamentos · ${new Date(i.criado_em).toLocaleDateString('pt-BR')}</small></div><button class="sm dan" onclick="desfazImport('${i.id}')">Desfazer</button></div>`).join('')||'<div class="empty">Nenhuma importação ainda</div>'}</div></div><div id="irev"></div>`;
  if(imp.rows.length)mostraRevisao();
}
async function lerTexto(file){const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes('�'))t=new TextDecoder('windows-1252').decode(buf);return t}
function parseOFX(t){
  const out=[];(t.match(/<STMTTRN>[\s\S]*?(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi)||[]).forEach(b=>{
    const g=k=>(b.match(new RegExp('<'+k+'>\\s*([^<\\r\\n]+)','i'))||[])[1];
    const d=(g('DTPOSTED')||'').trim(),v=parseFloat((g('TRNAMT')||'').replace(',','.'));
    if(d.length>=8&&!isNaN(v))out.push({data:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),desc:(g('MEMO')||g('NAME')||'').trim(),v,fitid:(g('FITID')||'').trim()||null})});
  return out}
function parseCSV(t){
  const linhas=t.split(/\r?\n/).filter(x=>x.trim());if(!linhas.length)return[];
  const sep=[';','\t',','].sort((a,b)=>linhas[0].split(b).length-linhas[0].split(a).length)[0];
  const cel=L=>{const r=[];let c='',q=false;for(const ch of L){if(ch==='"')q=!q;else if(ch===sep&&!q){r.push(c);c=''}else c+=ch}r.push(c);return r.map(x=>x.trim())};
  const rows=linhas.map(cel),norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const dataFmt=x=>{let m;if(m=x.match(/^(\d{2})\/(\d{2})\/(\d{4})/))return m[3]+'-'+m[2]+'-'+m[1];if(m=x.match(/^(\d{2})\/(\d{2})\/(\d{2})$/))return '20'+m[3]+'-'+m[2]+'-'+m[1];if(m=x.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[0].slice(0,10);return null};
  const hIdx=rows.findIndex(r=>r.some(x=>/^(data|date)/.test(norm(x)))&&r.some(x=>/(valor|amount|entrada|saida|quantia)/.test(norm(x))));
  const out=[];
  if(hIdx>=0){
    const h=rows[hIdx].map(norm),iD=h.findIndex(x=>/^(data|date)/.test(x)),iV=h.findIndex(x=>/(valor|amount|quantia)/.test(x)),iE=h.findIndex(x=>/^entrada/.test(x)),iS=h.findIndex(x=>/^saida/.test(x));
    const iDe=h.map((x,i)=>/(descri|title|titulo|historico|lancamento|memo|estabelec|detalhe)/.test(x)&&i!==iD?i:-1).filter(i=>i>=0);
    rows.slice(hIdx+1).forEach(c=>{const data=dataFmt(c[iD]||'');let v;
      if(iV>=0)v=num(c[iV]);else if(iE>=0&&iS>=0)v=(num(c[iE])||0)-(num(c[iS])||0);
      const desc=[...new Set(iDe.map(i=>c[i]).filter(Boolean))].join(' · ');
      if(data&&typeof v==='number'&&!isNaN(v)&&v!==0)out.push({data,desc,v,fitid:null})});
  }else rows.forEach(c=>{let data,v,desc='';c.forEach(x=>{const d=dataFmt(x);if(!data&&d)data=d;else if(v===undefined&&/^-?[R$\s]*-?\d[\d.]*(,\d{1,2})?$|^-?\d+\.\d{1,2}$/.test(x))v=num(x);else if(x.length>desc.length)desc=x});if(data&&typeof v==='number'&&!isNaN(v))out.push({data,desc,v,fitid:null})});
  return out}
function montaRevisao(itens,tipoDest,destId){
  let sinal=-1;if(tipoDest==='k'){const pos=itens.filter(i=>i.v>0).length,neg=itens.filter(i=>i.v<0).length;sinal=pos>neg?1:-1}
  return itens.map(i=>{let tipo,ok=true,aviso='',skip=false;
    if(tipoDest==='k'){if(Math.sign(i.v)===sinal)tipo='cartao';else{tipo='cartao';ok=false;skip=true;aviso='pagamento ou estorno'}}
    else tipo=i.v<0?'saida':'entrada';
    const dup=S.lanc.some(l=>(i.fitid&&l.fitid===i.fitid)||(l.data===i.data&&Math.abs(l.valor-Math.abs(i.v))<.005&&l.descricao===(i.desc||'Importado')&&(tipoDest==='k'?l.cartao_id===destId:l.conta_id===destId)));
    if(dup){ok=false;aviso='já importado'}
    return{...i,tipo,ok,skip,aviso,cat:adivinha(i.desc)||'Outros'}})}
async function leImport(){
  const f=$('ifile').files[0];if(!f){toast('Escolha o arquivo do banco');return}
  try{const t=await lerTexto(f),itens=/<STMTTRN>/i.test(t)?parseOFX(t):parseCSV(t);
    if(!itens.length){toast('Não consegui ler lançamentos desse arquivo. Tente o formato OFX.');return}
    const d=$('idest').value;imp={dest:d,destNome:$('idest').selectedOptions[0].text,arquivo:f.name,rows:montaRevisao(itens,d[0],d.slice(2))};mostraRevisao();
  }catch(e){toast('Erro ao ler: '+e.message)}
}
function mostraRevisao(){
  const r=imp.rows,n=r.filter(x=>x.ok).length,tot=r.filter(x=>x.ok).reduce((a,x)=>a+(x.tipo==='entrada'?x.v:-Math.abs(x.v)),0);
  $('irev').innerHTML=`<div class="card" style="margin-top:14px"><h3>Revisar: ${esc(imp.arquivo)} <span class="tag">${r.length} linhas · ${n} novas</span></h3>
  <div class="hint" style="margin-bottom:8px">Destino: <b>${esc(imp.destNome)}</b>. Linhas "já importado" e pagamentos de fatura vêm desmarcadas. Ajuste a categoria se quiser.</div>
  <div style="overflow:auto;max-height:55vh"><table><thead><tr><th></th><th>Data</th><th>Descrição</th><th>Categoria</th><th class="n">Valor</th></tr></thead><tbody>${r.map((x,i)=>`<tr style="${x.ok?'':'opacity:.55'}"><td><input type="checkbox" style="width:auto" ${x.ok?'checked':''} ${x.skip?'disabled':''} onchange="imp.rows[${i}].ok=this.checked;mostraRevisaoTotal()"></td><td>${x.data.slice(8)}/${x.data.slice(5,7)}/${x.data.slice(2,4)}</td><td>${esc(x.desc||'(sem descrição)')}${x.aviso?`<div class="hint">${x.aviso}</div>`:''}</td><td><select style="padding:6px" onchange="imp.rows[${i}].cat=this.value">${(x.tipo==='entrada'?CAT_E:CAT_S).map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></td><td class="n ${x.tipo==='entrada'?'pos':'neg'}"><b>${x.tipo==='entrada'?'+':'−'} ${BRL(Math.abs(x.v))}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><span id="irtot" class="hint">${n} selecionadas · resultado ${BRL(tot)}</span><div class="row"><button onclick="imp={dest:'',destNome:'',arquivo:'',rows:[]};vImport()">Cancelar</button><button class="pri" onclick="confirmaImport()">Importar selecionadas</button></div></div></div>`;
}
function mostraRevisaoTotal(){const s=imp.rows.filter(x=>x.ok);$('irtot').textContent=s.length+' selecionadas · resultado '+BRL(s.reduce((a,x)=>a+(x.tipo==='entrada'?x.v:-Math.abs(x.v)),0))}
async function confirmaImport(){
  const sel=imp.rows.filter(r=>r.ok);if(!sel.length){toast('Nada selecionado');return}
  if(DEMO){toast('Modo demonstração: nada é gravado');return}
  const t=imp.dest[0],id=imp.dest.slice(2);
  const r1=await sb.from('importacoes').insert({arquivo:imp.arquivo,destino:imp.destNome,qtd:sel.length}).select().single();
  if(r1.error){toast('Erro: '+r1.error.message);return}
  const rows=sel.map(r=>({tipo:r.tipo,descricao:r.desc||'Importado',valor:Math.round(Math.abs(r.v)*100)/100,data:r.data,categoria:r.cat,conta_id:t==='c'?id:null,cartao_id:t==='k'?id:null,importacao_id:r1.data.id,fitid:r.fitid}));
  for(let i=0;i<rows.length;i+=300){const r=await sb.from('lancamentos').insert(rows.slice(i,i+300));
    if(r.error){toast('Erro: '+r.error.message+' — nada foi mantido');await sb.from('importacoes').delete().eq('id',r1.data.id);return}}
  toast(sel.length+' lançamentos importados');imp={dest:'',destNome:'',arquivo:'',rows:[]};await recarrega();
}
async function desfazImport(id){if(!confirm('Desfazer esta importação? Os lançamentos que vieram dela serão apagados.'))return;
  if(await db(sb?.from('importacoes').delete().eq('id',id))){toast('Importação desfeita');recarrega()}}

// ---------- entrada ----------
function mostraApp(){$('login').classList.add('hide');$('app').classList.remove('hide');$('fab').classList.remove('hide');$('btnSair').classList.toggle('hide',false)}
function mostraLogin(){$('app').classList.add('hide');$('fab').classList.add('hide');$('login').classList.remove('hide')}
$('lform').addEventListener('submit',async e=>{e.preventDefault();$('lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lsenha').value});
  if(error)$('lerr').textContent='E-mail ou senha incorretos.'});
async function iniciar(s){S.uid=s.user.id;S.email=s.user.email;mostraApp();await carregar();render();
  if(S.ultimaSync&&(Date.now()-new Date(S.ultimaSync).getTime())>6*36e5)sincronizar(true)}
(async()=>{
  ym=mesAtual();
  if(DEMO){$('demoBar').classList.remove('hide');S.uid='demo';S.email='emanuel@demo';mostraApp();await carregar();render();return}
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&s&&S.uid!==s.user.id)iniciar(s);if(ev==='SIGNED_OUT'){S={uid:null,email:'',cartoes:[],fixas:[],lanc:[],contas:[],importacoes:[],saldoInicial:0};mostraLogin()}});
  if(session)iniciar(session);else mostraLogin();
})();
</script>
